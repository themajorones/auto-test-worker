spring:
  application:
    name: atw
  profiles:
    default: dev
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:atw/.env[.properties]
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: wrapper
    username: admin
    password: admin
    listener:
      simple:
        concurrency: 10
        max-concurrency: 10
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
            scope: read:user,repo,read:org
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

security:
  encryption:
    password: ${ENCRYPTION_PASSWORD}
    salt: ${ENCRYPTION_SALT}

artifact:
  storage:
    endpoint: ${ARTIFACT_STORAGE_ENDPOINT:}
    region: ${ARTIFACT_STORAGE_REGION:us-east-1}
    access-key: ${ARTIFACT_STORAGE_ACCESS_KEY:}
    secret-key: ${ARTIFACT_STORAGE_SECRET_KEY:}
    bucket: ${ARTIFACT_STORAGE_BUCKET:ats-artifacts}
    prefix: ${ARTIFACT_STORAGE_PREFIX:}
    path-style-access: ${ARTIFACT_STORAGE_PATH_STYLE_ACCESS:true}
    create-bucket: ${ARTIFACT_STORAGE_CREATE_BUCKET:false}

vision:
  gemini:
    api-keys: ${VISION_GEMINI_API_KEYS:}
    model: ${VISION_GEMINI_MODEL:gemini-3.1-flash-lite-preview}
  openrouter:
    api-keys: ${VISION_OPENROUTER_API_KEYS:}
    model: ${VISION_OPENROUTER_MODEL:google/gemini-3.1-flash-lite-preview}
